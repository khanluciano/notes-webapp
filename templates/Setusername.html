<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pick a Username</title>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1a1a1e;
            --text-main: #e1e1e6;
            --text-muted: #8d8d99;
            --accent: #00b37e;
            --border: #29292e;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .google-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 1.75rem;
        }

        .google-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00b37e, #1d4ed8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
            color: white;
            flex-shrink: 0;
        }

        .google-info h3 {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .google-info p {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        .subtitle {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 1.75rem;
            line-height: 1.5;
        }

        .form-group {
            position: relative;
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 0.5rem;
        }

        .form-group input {
            width: 100%;
            background: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.95rem;
            padding: 12px 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: var(--accent);
        }

        .hint {
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-top: 6px;
        }

        .error-banner {
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--danger);
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 0.85rem;
            color: var(--danger);
            margin-bottom: 1.25rem;
            display: {{if .Error}}flex{{else}}none{{end}};
            align-items: center;
            gap: 8px;
        }

        .btn-submit {
            width: 100%;
            background-color: var(--accent);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.15s;
            margin-top: 0.5rem;
        }

        .btn-submit:hover {
            opacity: 0.85;
        }

        .divider {
            height: 1px;
            background-color: var(--border);
            margin: 1.5rem 0;
        }
    </style>
</head>
<body>

    <div class="card">

        <div class="google-badge">
            <div class="google-avatar">G</div>
            <div class="google-info">
                <h3>Signed in with Google</h3>
                <p>{{.Email}}</p>
            </div>
        </div>

        <div class="divider"></div>

        <h2>One last step</h2>
        <p class="subtitle">Choose a username for your account. You'll use this to sign in next time.</p>

        {{if .Error}}
        <div class="error-banner">
            ⚠ {{.Error}}
        </div>
        {{end}}

        <form action="/auth/set-username" method="POST" autocomplete="off">
            <input type="hidden" name="google_id" value="{{.GoogleID}}">
            <input type="hidden" name="email" value="{{.Email}}">

            <div class="form-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="e.g. khan_notes"
                    minlength="4"
                    maxlength="25"
                    required
                    autofocus
                >
                <p class="hint">4 to 25 characters. Letters, numbers, and underscores only.</p>
            </div>

            <button type="submit" class="btn-submit">Create Account</button>
        </form>

    </div>

</body>
</html>
